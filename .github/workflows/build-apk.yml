name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses Directly
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Web Bundle & Sync Android Platform
        if: hashFiles('package.json') != ''
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev --legacy-peer-deps
          npm run build
          if [ ! -f "dist/index.html" ]; then
            mkdir -p dist
            cp index.html dist/index.html
          fi
          if [ -f "public/manifest.json" ]; then
            cp public/manifest.json dist/manifest.json
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

