name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Bundle & Sync Android Platform
        if: hashFiles('package.json') != ''
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev --legacy-peer-deps
          npm run build
          if [ ! -f "dist/index.html" ]; then
            mkdir -p dist
            cp index.html dist/index.html
          fi
          if [ -f "public/manifest.json" ]; then
            cp public/manifest.json dist/manifest.json
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Assemble Debug APK
        id: build_apk
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
            APK_SOURCE=$(find . -path "*/outputs/apk/debug/*.apk" | head -n 1)
          else
            chmod +x android/gradlew
            cd android
            ./gradlew assembleDebug --no-daemon --stacktrace
            cd ..
            APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          mkdir -p release-assets
          cp "$APK_SOURCE" "release-assets/app-debug.apk"
          cp "$APK_SOURCE" "release-assets/Trade-Flow-Pro-debug-b${{ github.run_number }}.apk"

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Trade-Flow-Pro-debug-apk-${{ github.run_number }}
          path: |
            release-assets/app-debug.apk
            release-assets/Trade-Flow-Pro-debug-b${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Debug APK to GitHub Releases
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: "Trade Flow Pro — Debug APK (Build #${{ github.run_number }})"
          body: |
            Automated Debug APK build for **Trade Flow Pro** from commit `${{ github.sha }}`.
            - **Installable APK**: `Trade-Flow-Pro-debug-b${{ github.run_number }}.apk` (or `app-debug.apk`)
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            release-assets/Trade-Flow-Pro-debug-b${{ github.run_number }}.apk
            release-assets/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
